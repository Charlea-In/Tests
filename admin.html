<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin · Charléa Weddings</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1A1410;
      --surface: #231C18;
      --card:    #2C2420;
      --gold:    #C9A96E;
      --gold2:   #E8CFA0;
      --rose:    #D4B8B0;
      --text:    #F5EDE8;
      --muted:   #9A8878;
      --border:  rgba(201,169,110,0.18);
      --green:   #7BAF8E;
      --red:     #C97070;
      --yellow:  #C9A96E;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-logo {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 36px;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .login-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      padding: 14px 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .login-input:focus { border-color: var(--gold); }

    .login-btn {
      width: 100%;
      background: var(--gold);
      color: #1A1410;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover { background: var(--gold2); }

    .login-error {
      color: var(--red);
      font-size: 12px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* ── APP ── */
    #app { display: none; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-brand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--gold);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stats-pill {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stats-pill span {
      color: var(--gold);
      font-weight: 700;
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ── ADD GUEST FORM ── */
    .add-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 32px;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 120px auto;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .field-label {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 8px;
    }

    .field-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field-input:focus { border-color: var(--gold); }
    .field-input::placeholder { color: var(--muted); }

    .add-btn {
      background: var(--gold);
      color: #1A1410;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      height: 44px;
    }

    .add-btn:hover { background: var(--gold2); }

    /* ── BASE URL CONFIG ── */
    .base-url-row {
      margin-bottom: 20px;
    }

    /* ── GUEST TABLE ── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      padding: 8px 14px;
      outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }

    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--muted); }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 20px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 16px 20px;
      font-size: 13px;
      border-bottom: 1px solid rgba(201,169,110,0.07);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(201,169,110,0.04); }

    .guest-name-cell {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: var(--text);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .badge-si    { background: rgba(123,175,142,0.15); color: var(--green); }
    .badge-no    { background: rgba(201,112,112,0.15); color: var(--red); }
    .badge-pend  { background: rgba(201,169,110,0.12); color: var(--muted); }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
    .icon-btn.copy-success { border-color: var(--green); color: var(--green); }

    .del-btn:hover { border-color: var(--red); color: var(--red); }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
      font-style: italic;
    }

    /* ── LINK PREVIEW ── */
    .link-preview {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      max-width: 280px;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--gold);
      color: var(--gold2);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: transform 0.3s ease;
      z-index: 999;
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── RSVP STATUS COUNTER ── */
    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 24px;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }

    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      color: var(--gold);
      line-height: 1;
    }

    .stat-lbl {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Charléa</div>
    <div class="login-sub">Panel de Administración</div>
    <input class="login-input" id="pwd-input" type="password" placeholder="Contraseña"
      onkeydown="if(event.key==='Enter') doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">

  <div class="topbar">
    <div class="topbar-brand">Charléa · Admin</div>
    <div class="topbar-right">
      <div class="stats-pill">Total: <span id="stat-total">0</span></div>
      <div class="stats-pill">Confirmados: <span id="stat-si">0</span></div>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-chip">
        <div class="stat-num" id="s-total">0</div>
        <div class="stat-lbl">Invitados</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="s-si" style="color:#7BAF8E">0</div>
        <div class="stat-lbl">Confirmaron</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="s-no" style="color:#C97070">0</div>
        <div class="stat-lbl">No asistirán</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="s-pend" style="color:#9A8878">0</div>
        <div class="stat-lbl">Pendientes</div>
      </div>
    </div>

    <!-- Add guest -->
    <div class="add-card">
      <div class="card-title">✦ Agregar Invitado</div>

      <div class="base-url-row">
        <label class="field-label">URL base de la invitación</label>
        <input class="field-input" id="base-url"
          placeholder="https://charlea-in.github.io/Tests/"
          value="https://charlea-in.github.io/Tests/"/>
      </div>

      <div class="form-row">
        <div>
          <label class="field-label">Nombre del invitado</label>
          <input class="field-input" id="new-nombre"
            placeholder="Ej. María González"
            onkeydown="if(event.key==='Enter') addGuest()"/>
        </div>
        <div>
          <label class="field-label">Lugares</label>
          <input class="field-input" id="new-lugares" type="number"
            min="1" max="10" value="2"
            onkeydown="if(event.key==='Enter') addGuest()"/>
        </div>
        <div>
          <button class="add-btn" onclick="addGuest()">+ Agregar</button>
        </div>
      </div>
    </div>

    <!-- Guest table -->
    <div class="table-card">
      <div class="table-header">
        <div class="card-title" style="margin:0">✦ Lista de Invitados</div>
        <input class="search-input" id="search-input"
          placeholder="Buscar invitado..."
          oninput="renderTable()"/>
      </div>

      <table id="guest-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Lugares</th>
            <th>RSVP</th>
            <th>Link</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="6" class="empty-state">Aún no hay invitados. Agrega el primero ✦</td></tr>
        </tbody>
      </table>
    </div>

  </div><!-- /.main -->
</div><!-- /#app -->

<div id="toast">¡Copiado!</div>

<script>
/* ── CONFIG ── */
// Cambia esta contraseña antes de subir al repo
const ADMIN_PASSWORD = 'charlea2026';
const STORAGE_KEY    = 'charlea_guests';

/* ── AUTH ── */
function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderAll();
  } else {
    document.getElementById('login-error').textContent = 'Contraseña incorrecta.';
  }
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('pwd-input').value = '';
  document.getElementById('login-error').textContent = '';
}

/* ── DATA ── */
function loadGuests() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveGuests(guests) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(guests));
}

/* ── LINK GENERATOR ── */
function buildLink(nombre, lugares) {
  const base = document.getElementById('base-url').value.trim().replace(/\/$/, '');
  const n = encodeURIComponent(nombre);
  const l = encodeURIComponent(lugares);
  return `${base}/?n=${n}&l=${l}`;
}

/* ── ADD GUEST ── */
function addGuest() {
  const nombre  = document.getElementById('new-nombre').value.trim();
  const lugares = parseInt(document.getElementById('new-lugares').value) || 2;

  if (!nombre) {
    document.getElementById('new-nombre').focus();
    return;
  }

  const guests = loadGuests();
  guests.push({
    id:       Date.now(),
    nombre,
    lugares,
    rsvp:     'pendiente', // pendiente | si | no
    personas: 0,
    mensaje:  ''
  });
  saveGuests(guests);

  document.getElementById('new-nombre').value  = '';
  document.getElementById('new-lugares').value = '2';
  document.getElementById('new-nombre').focus();

  renderAll();
  showToast('Invitado agregado ✦');
}

/* ── DELETE GUEST ── */
function deleteGuest(id) {
  if (!confirm('¿Eliminar este invitado?')) return;
  const guests = loadGuests().filter(g => g.id !== id);
  saveGuests(guests);
  renderAll();
}

/* ── UPDATE RSVP MANUALLY ── */
function cycleRSVP(id) {
  const guests = loadGuests();
  const g = guests.find(g => g.id === id);
  if (!g) return;
  const cycle = { pendiente: 'si', si: 'no', no: 'pendiente' };
  g.rsvp = cycle[g.rsvp] || 'pendiente';
  saveGuests(guests);
  renderAll();
}

/* ── COPY LINK ── */
function copyLink(id) {
  const guests = loadGuests();
  const g = guests.find(g => g.id === id);
  if (!g) return;
  const link = buildLink(g.nombre, g.lugares);
  navigator.clipboard.writeText(link).then(() => showToast('¡Link copiado!'));
}

/* ── OPEN PREVIEW ── */
function openPreview(id) {
  const guests = loadGuests();
  const g = guests.find(g => g.id === id);
  if (!g) return;
  window.open(buildLink(g.nombre, g.lugares), '_blank');
}

/* ── RENDER ── */
function renderAll() {
  renderStats();
  renderTable();
}

function renderStats() {
  const guests = loadGuests();
  const si     = guests.filter(g => g.rsvp === 'si').length;
  const no     = guests.filter(g => g.rsvp === 'no').length;
  const pend   = guests.filter(g => g.rsvp === 'pendiente').length;

  document.getElementById('s-total').textContent = guests.length;
  document.getElementById('s-si').textContent    = si;
  document.getElementById('s-no').textContent    = no;
  document.getElementById('s-pend').textContent  = pend;
  document.getElementById('stat-total').textContent = guests.length;
  document.getElementById('stat-si').textContent    = si;
}

function renderTable() {
  const q      = (document.getElementById('search-input').value || '').toLowerCase();
  const guests = loadGuests().filter(g =>
    !q || g.nombre.toLowerCase().includes(q)
  );
  const tbody  = document.getElementById('table-body');

  if (guests.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">
      ${q ? 'Sin resultados para "' + q + '"' : 'Aún no hay invitados. Agrega el primero ✦'}
    </td></tr>`;
    return;
  }

  const rsvpLabel = { si: 'Confirmó', no: 'No asiste', pendiente: 'Pendiente' };
  const rsvpClass = { si: 'badge-si', no: 'badge-no', pendiente: 'badge-pend' };

  tbody.innerHTML = guests.map((g, i) => {
    const link = buildLink(g.nombre, g.lugares);
    return `
      <tr>
        <td style="color:var(--muted);font-size:12px">${i + 1}</td>
        <td class="guest-name-cell">${g.nombre}</td>
        <td style="color:var(--muted)">${g.lugares}</td>
        <td>
          <span class="badge ${rsvpClass[g.rsvp]}"
            onclick="cycleRSVP(${g.id})"
            style="cursor:pointer" title="Clic para cambiar estado">
            ${rsvpLabel[g.rsvp]}
          </span>
        </td>
        <td class="link-preview">
          <span style="opacity:0.5;font-size:10px">${link.slice(0, 48)}…</span>
        </td>
        <td>
          <div class="action-btns">
            <button class="icon-btn" onclick="copyLink(${g.id})" title="Copiar link">📋 Copiar</button>
            <button class="icon-btn" onclick="openPreview(${g.id})" title="Ver invitación">👁 Ver</button>
            <button class="icon-btn del-btn" onclick="deleteGuest(${g.id})" title="Eliminar">✕</button>
          </div>
        </td>
      </tr>`;
  }).join('');
}

/* ── TOAST ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── INIT ── */
document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
